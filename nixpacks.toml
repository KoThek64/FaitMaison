[variables]
APP_ENV = "prod"

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "php bin/console tailwind:build --env=prod",
    "php bin/console asset-map:compile --env=prod",
]

[start]
cmd = "php bin/console cache:warmup && php bin/console doctrine:migrations:migrate --no-interaction && php -S 0.0.0.0:$PORT -t public public/router.php"
